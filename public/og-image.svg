<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Social share card (1200x630, the OG standard). Rendered once, static. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Dark base -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft accent blobs for depth -->
  <circle cx="120" cy="120" r="220" fill="#6366f1" opacity="0.18"/>
  <circle cx="1080" cy="520" r="240" fill="#8b5cf6" opacity="0.18"/>

  <!-- Logo mark -->
  <text x="80" y="140" font-family="monospace" font-size="34" fill="#818cf8" font-weight="700">&lt;Meethu/&gt;</text>

  <!-- Name -->
  <text x="80" y="320" font-family="'Space Grotesk', system-ui, sans-serif" font-size="84" font-weight="700" fill="#f1f5f9">Meethu Prasanth K K</text>

  <!-- Title in accent -->
  <text x="82" y="400" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="600" fill="url(#accent)">Software Engineer</text>

  <!-- Tagline -->
  <text x="82" y="470" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#94a3b8">Backend &amp; Full-Stack · Python · FastAPI · Django</text>

  <!-- Accent underline -->
  <rect x="82" y="500" width="120" height="6" rx="3" fill="url(#accent)"/>
</svg>
