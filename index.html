    <!--
      No-flash dark mode.
      Runs before React paints so the correct theme is applied immediately,
      preventing a light→dark flicker on load. Reads a saved preference first,
      then falls back to the OS setting. ThemeContext keeps localStorage in sync.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  </body>
